{%- extends "templates/web.html" -%}

{%- block page_content -%}
<div id="app"></div>
{%- endblock -%}

{%- block navbar %}{% endblock %}

{%- block style -%}
{{ super() }}
<link rel="icon" type="image/svg+xml" href="/assets/institution_erp/portal/assets/favicon.svg" />
<link rel="stylesheet" href="/assets/institution_erp/css/inter-font.css" />
<link rel="stylesheet" href="/assets/institution_erp/portal/assets/portal.css" />
<style>
  :root {
    --color-primary: #2563eb;
    --color-primary-light: #3b82f6;
    --color-primary-dark: #1d4ed8;
    --color-success: #16a34a;
    --color-warning: #d97706;
    --color-danger: #dc2626;
    --color-bg: #f1f5f9;
    --color-surface: #ffffff;
    --color-text: #1e293b;
    --color-text-muted: #64748b;
    --color-border: #e2e8f0;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    --shadow-md: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100% !important; min-width: 0 !important; overflow-x: hidden !important; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--color-bg); color: var(--color-text); }
  #app { min-height: 100vh; width: 100% !important; max-width: none !important; }
  /* Strip ALL Frappe container/wrapper constraints */
  .page-content-wrapper, .page_content, .container, .web-page-content {
    max-width: none !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  main {
    width: 100% !important;
  }
  main.container, .container {
    max-width: none !important;
    width: 100% !important;
    margin: 0 auto !important;
    padding: 0 !important;
  }
  /* Hide Frappe default elements for clean portal */
  .frappe-nav, .navbar, .navbar-default, .navbar-nav, footer, .page-header-wrapper, .page-header, .page-container > .container { display: none !important; }
</style>
{%- endblock -%}

{%- block script -%}
{{ super() }}
<script>
  window.csrf_token = '{{ frappe.session.csrf_token or "" }}' === 'None' ? '' : '{{ frappe.session.csrf_token or "" }}';
</script>
<script type="module" src="/assets/institution_erp/portal/assets/portal.js"></script>
{%- endblock -%}
