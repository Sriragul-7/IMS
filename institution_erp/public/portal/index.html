<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Institution ERP - Student Portal</title>
  <style>
    :root {
      --color-primary: #2563eb;
      --color-primary-light: #3b82f6;
      --color-primary-dark: #1d4ed8;
      --color-success: #16a34a;
      --color-warning: #d97706;
      --color-danger: #dc2626;
      --color-bg: #f1f5f9;
      --color-surface: #ffffff;
      --color-text: #1e293b;
      --color-text-muted: #64748b;
      --color-border: #e2e8f0;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--color-bg); color: var(--color-text); }
    #app { min-height: 100vh; }
  </style>
  <script type="module" crossorigin src="/assets/portal.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/portal.css">
</head>
<body>
  <div id="app"></div>
</body>
</html>
