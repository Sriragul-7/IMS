<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,10 L10,5 Z" fill="#2563eb" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.12" />
    </filter>
  </defs>
  <rect width="1400" height="900" fill="#ffffff" />
  <text x="700" y="40" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1e293b">Technology Stack — Institution ERP (Frappe v16)</text>

  <!-- Layer 1: Client / Presentation -->
  <g id="layer1" transform="translate(40, 70)">
    <rect x="0" y="0" width="1320" height="150" fill="url(#grad1)" stroke="#94a3b8" stroke-width="2" rx="10" filter="url(#shadow)" />
    <text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Layer 1 — Client / Presentation</text>
    <rect x="30" y="50" width="400" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" />
    <text x="50" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Student / Guardian Portal</text>
    <text x="50" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">Vue 3 SPA • Hash Routing • Portal pages</text>
    <text x="50" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">Child Switcher • Row-scoped data</text>
    <rect x="460" y="50" width="400" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" />
    <text x="480" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Staff Cockpits (7 roles)</text>
    <text x="480" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">Instructor • Fee Manager • Facility Mgr</text>
    <text x="480" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">Comm Officer • Admissions • Acad Head • Admin</text>
    <rect x="890" y="50" width="400" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" />
    <text x="910" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Frappe Desk (re-themed)</text>
    <text x="910" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">Inter font • BIT blue (#2563eb) • Desk CSS</text>
    <text x="910" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">Full CRUD for all DocTypes</text>
  </g>

  <!-- Layer 2: API / Integration -->
  <g id="layer2" transform="translate(40, 240)">
    <rect x="0" y="0" width="1320" height="150" fill="url(#grad1)" stroke="#94a3b8" stroke-width="2" rx="10" filter="url(#shadow)" />
    <text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Layer 2 — API / Integration</text>
    <rect x="30" y="50" width="620" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" />
    <text x="50" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Whitelisted API Methods (11)</text>
    <text x="50" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">Bulk attendance • Assessment results • Fee generation</text>
    <text x="50" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">Notice dispatch • User creation • Student/Guardian APIs</text>
    <rect x="680" y="50" width="620" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" />
    <text x="700" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">REST API &amp; Authentication</text>
    <text x="700" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">frappe.call() • Session / JWT • CSRF token injection</text>
    <text x="700" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">Cross-origin ready • Role-based routing</text>
  </g>

  <!-- Layer 3: Business Logic / Server -->
  <g id="layer3" transform="translate(40, 410)">
    <rect x="0" y="0" width="1320" height="150" fill="url(#grad1)" stroke="#94a3b8" stroke-width="2" rx="10" filter="url(#shadow)" />
    <text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Layer 3 — Business Logic / Server</text>
    <rect x="30" y="50" width="400" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" />
    <text x="50" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Frappe Framework v16</text>
    <text x="50" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">Python 3.10+ • DocType Controllers • Hooks</text>
    <text x="50" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">Server scripts • Workflow engine</text>
    <rect x="460" y="50" width="400" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" />
    <text x="480" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Permission Model</text>
    <text x="480" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">16 permission_query_conditions</text>
    <text x="480" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">19 DocTypes • Row-level scoping</text>
    <rect x="890" y="50" width="400" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" />
    <text x="910" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">8 Custom Roles</text>
    <text x="910" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">6 Staff + 2 Portal (Student, Guardian)</text>
    <text x="910" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">User Permissions + SQL WHERE injection</text>
  </g>

  <!-- Layer 4: Data / Storage -->
  <g id="layer4" transform="translate(40, 580)">
    <rect x="0" y="0" width="1320" height="150" fill="url(#grad1)" stroke="#94a3b8" stroke-width="2" rx="10" filter="url(#shadow)" />
    <text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Layer 4 — Data / Storage</text>
    <rect x="30" y="50" width="400" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" />
    <text x="50" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">MariaDB 10.6+</text>
    <text x="50" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">48 DocTypes across 10 modules</text>
    <text x="50" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">Relational metadata-driven schema</text>
    <rect x="460" y="50" width="400" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" />
    <text x="480" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Redis 7+</text>
    <text x="480" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">Caching • Sessions • Queue</text>
    <text x="480" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">File attachments • Real-time pub/sub</text>
    <rect x="890" y="50" width="400" height="90" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" />
    <text x="910" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">File System</text>
    <text x="910" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">Uploaded documents • Fee receipts</text>
    <text x="910" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#64748b">Applicant docs • Library items</text>
  </g>

  <!-- Layer 5: DevOps / Infra -->
  <g id="layer5" transform="translate(40, 750)">
    <rect x="0" y="0" width="1320" height="110" fill="url(#grad1)" stroke="#94a3b8" stroke-width="2" rx="10" filter="url(#shadow)" />
    <text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Layer 5 — DevOps / Infrastructure</text>
    <rect x="30" y="50" width="620" height="50" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" />
    <text x="50" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Ubuntu 22.04 LTS • Frappe Bench • Gunicorn • Nginx</text>
    <rect x="680" y="50" width="620" height="50" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" rx="8" />
    <text x="700" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e293b">Node 18+ • Vite 5 • GitHub Actions • Zero-cost open stack</text>
  </g>

  <!-- Arrows between layers -->
  <line x1="700" y1="220" x2="700" y2="240" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="700" y1="390" x2="700" y2="410" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="700" y1="560" x2="700" y2="580" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="700" y1="730" x2="700" y2="750" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)" />
</svg>